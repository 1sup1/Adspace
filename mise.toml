[tools]
node = "24.19.0"
python = "3.13.15"
uv = "0.12.3"
xcodegen = "2.46.0"

[env]
_.file = { path = ".env.local", redact = true }
OPENAI_MODEL = "gpt-5.6-luna"
DEVELOPER_DIR = "/Applications/Xcode-beta.app/Contents/Developer"
ADSPACE_SIMULATOR = "iPhone 17 Pro"

[tasks.setup]
description = "Install system packages and project runtimes"
run = "brew bundle && mise install && uv sync --directory server && xcodegen generate"

[tasks.check]
description = "Verify the development environment"
run = "node --version && npm --version && python --version && uv --version && xcodegen --version && xcodebuild -version"

[tasks.server]
description = "Run the local Agents SDK server"
run = "uv run --directory server python main.py"

[tasks."server:test"]
description = "Run deterministic server policy tests"
run = "uv run --directory server python -m unittest -v"

[tasks."ios:generate"]
description = "Generate the Xcode project"
run = "xcodegen generate"

[tasks."ios:build"]
description = "Build the iOS app for Simulator"
run = "xcodebuild -project AdaptiveSpace.xcodeproj -scheme AdaptiveSpace -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build -quiet"

[tasks."ios:test"]
description = "Run iOS unit tests"
run = "xcodebuild -project AdaptiveSpace.xcodeproj -scheme AdaptiveSpace -destination 'platform=iOS Simulator,name=$ADSPACE_SIMULATOR' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO -only-testing:AdaptiveSpaceTests test -quiet"

[tasks."ios:test-ui"]
description = "Run the full Simulator flow; requires mise run server in another terminal"
run = "xcodebuild -project AdaptiveSpace.xcodeproj -scheme AdaptiveSpace -destination 'platform=iOS Simulator,name=$ADSPACE_SIMULATOR' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:AdaptiveSpaceUITests test -quiet"
